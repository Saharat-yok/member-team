name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run server tests with coverage (>= 80%)
        run: npm run test:cov -w server

      - name: Run client tests
        run: npm test -w client

      - name: Build production PWA bundle
        run: npm run build -w client
